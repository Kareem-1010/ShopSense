version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopsense-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: shopsense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopsense"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsense-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/shopsense
      ENVIRONMENT: production
      RRF_K: 60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopsense-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    restart: unless-stopped

volumes:
  postgres_data:
